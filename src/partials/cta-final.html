<section class="section theme-orange cta-final" aria-labelledby="cta-title">
  <div class="streaks streaks--orange" aria-hidden="true"></div>
  <div class="cta-final__symbol" aria-hidden="true"><svg viewBox="0 0 608 559"><use href="#odin-symbol"/></svg></div>
  <div class="container">
    <p class="eyebrow">Vamos conversar</p>
    <h2 class="cta-final__title" id="cta-title" data-reveal>Do caos <br class="br-md">à <strong>estrutura.</strong></h2>
    <p class="cta-final__lead" data-reveal style="--d:.1s">Vamos entender o momento da sua empresa e estruturar o próximo passo com clareza.</p>
    <div class="cta-final__actions" data-reveal style="--d:.2s">
      <a class="btn btn--light btn--lg" href="contato.html#conversa"><span>Estruture antes de escalar</span><svg class="btn__icon" aria-hidden="true"><use href="#i-arrow"/></svg></a>
      <a class="cta-final__mail" href="mailto:{{site.email}}">{{site.email}}</a>
    </div>
  </div>
</section>
